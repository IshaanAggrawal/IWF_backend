version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: iwf_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: .
    container_name: iwf_backend
    environment:
      - MONGO_URI=mongodb://root:example@mongodb:27017/iwf?authSource=admin
      - PORT=5000
    depends_on:
      - mongodb
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: iwf_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
